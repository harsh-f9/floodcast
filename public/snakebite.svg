<svg width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="sbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2.2" fill="#0a3d62" opacity="0.12"/>
    </pattern>
    <filter id="sbSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="#f2f8f2"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#sbGrid)"/>

  <!-- soft backdrop blob -->
  <ellipse cx="400" cy="300" rx="330" ry="220" fill="#dcf2dc" opacity="0.6" filter="url(#sbSoft)"/>

  <!-- snake: starts top-left, runs right then down like classic snake -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="2.6s" repeatCount="indefinite"/>
    <!-- body segments -->
    <rect x="120" y="120" width="76" height="76" rx="20" fill="#15803d"/>
    <rect x="204" y="120" width="76" height="76" rx="20" fill="#22c55e"/>
    <rect x="288" y="120" width="76" height="76" rx="20" fill="#22c55e"/>
    <rect x="372" y="120" width="76" height="76" rx="20" fill="#22c55e"/>
    <rect x="456" y="120" width="76" height="76" rx="20" fill="#22c55e"/>
    <rect x="456" y="204" width="76" height="76" rx="20" fill="#22c55e"/>
    <rect x="372" y="204" width="76" height="76" rx="20" fill="#4ade80"/>
    <!-- head eyes -->
    <circle cx="152" cy="148" r="9" fill="#ffffff"/>
    <circle cx="152" cy="148" r="4.5" fill="#0a3d62"/>
    <circle cx="186" cy="148" r="9" fill="#ffffff"/>
    <circle cx="186" cy="148" r="4.5" fill="#0a3d62"/>
    <!-- letters spelling COM... -->
    <g font-family="Arial, sans-serif" font-weight="bold" font-size="40" text-anchor="middle" fill="#ffffff">
      <text x="158" y="188">C</text>
      <text x="242" y="172">O</text>
      <text x="326" y="172">M</text>
      <text x="410" y="172">I</text>
      <text x="494" y="172">N</text>
      <text x="494" y="256">G</text>
    </g>
  </g>

  <!-- apple fruit (emoji) with pulse -->
  <g>
    <text x="620" y="300" font-size="84" text-anchor="middle">
      🍎
      <animate attributeName="opacity" values="1;0.75;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
    <ellipse cx="620" cy="308" rx="34" ry="8" fill="#15803d" opacity="0.15">
      <animate attributeName="rx" values="30;38;30" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- faint trail dots showing path -->
  <g fill="#22c55e" opacity="0.25">
    <circle cx="300" cy="330" r="8"/>
    <circle cx="360" cy="330" r="8"/>
    <circle cx="420" cy="330" r="8"/>
    <circle cx="480" cy="330" r="8"/>
    <circle cx="540" cy="330" r="8"/>
  </g>
</svg>

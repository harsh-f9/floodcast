<svg width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e9c2"/>
      <stop offset="55%" stop-color="#f3c67e"/>
      <stop offset="100%" stop-color="#e0995a"/>
    </linearGradient>
    <linearGradient id="skGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a05e"/>
      <stop offset="35%" stop-color="#a37c42"/>
      <stop offset="100%" stop-color="#6e4f26"/>
    </linearGradient>
    <linearGradient id="skBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ba23a"/>
      <stop offset="55%" stop-color="#4e7320"/>
      <stop offset="100%" stop-color="#31490f"/>
    </linearGradient>
    <radialGradient id="skSunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2a1f08" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1f08" stop-opacity="0"/>
    </radialGradient>
    <filter id="skSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- ======== SKY ======== -->
  <rect x="0" y="0" width="800" height="430" fill="url(#skSky)"/>
  <ellipse cx="640" cy="120" rx="150" ry="150" fill="url(#skSunGlow)"/>
  <circle cx="640" cy="120" r="46" fill="#fff3cf"/>
  <circle cx="640" cy="120" r="60" fill="#fff3cf" opacity="0.35">
    <animate attributeName="r" values="58;66;58" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.2;0.35" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds drifting -->
  <g fill="#fdf6e3" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 46 0; 0 0" dur="16s" repeatCount="indefinite"/>
      <ellipse cx="180" cy="110" rx="90" ry="26"/>
      <ellipse cx="240" cy="120" rx="70" ry="22"/>
      <ellipse cx="130" cy="122" rx="55" ry="18"/>
    </g>
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0; -36 0; 0 0" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="480" cy="70" rx="70" ry="20"/>
      <ellipse cx="530" cy="78" rx="50" ry="16"/>
    </g>
  </g>

  <!-- distant bushes -->
  <g fill="#7a6b2f" opacity="0.8">
    <ellipse cx="90" cy="392" rx="70" ry="26"/>
    <ellipse cx="330" cy="398" rx="90" ry="30"/>
    <ellipse cx="600" cy="394" rx="80" ry="26"/>
    <ellipse cx="760" cy="398" rx="60" ry="22"/>
  </g>
  <g fill="#5d5323" opacity="0.8">
    <ellipse cx="150" cy="400" rx="46" ry="16"/>
    <ellipse cx="420" cy="402" rx="60" ry="18"/>
    <ellipse cx="680" cy="400" rx="52" ry="16"/>
  </g>

  <!-- birds -->
  <g stroke="#5a4a28" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-60 120; 860 80" dur="32s" repeatCount="indefinite"/>
      <path d="M0,0 q8,-8 16,0 q8,-8 16,0"/>
      <path d="M52,22 q7,-7 14,0 q7,-7 14,0"/>
    </g>
  </g>

  <!-- ======== GROUND ======== -->
  <rect x="0" y="400" width="800" height="200" fill="url(#skGround)"/>
  <path d="M0,400 Q200,388 400,398 Q600,408 800,396 L800,412 L0,412 Z" fill="#8a6535" opacity="0.6"/>
  <!-- pebbles -->
  <g fill="#5d421f" opacity="0.5">
    <ellipse cx="80" cy="470" rx="9" ry="6"/><ellipse cx="150" cy="520" rx="12" ry="7"/>
    <ellipse cx="250" cy="450" rx="7" ry="5"/><ellipse cx="360" cy="530" rx="11" ry="7"/>
    <ellipse cx="470" cy="460" rx="8" ry="5"/><ellipse cx="560" cy="525" rx="12" ry="8"/>
    <ellipse cx="680" cy="480" rx="9" ry="6"/><ellipse cx="740" cy="540" rx="11" ry="7"/>
    <ellipse cx="40" cy="550" rx="10" ry="6"/><ellipse cx="310" cy="490" rx="6" ry="4"/>
  </g>
  <g fill="#d9b878" opacity="0.6">
    <ellipse cx="110" cy="490" rx="7" ry="4"/><ellipse cx="290" cy="545" rx="8" ry="5"/>
    <ellipse cx="420" cy="480" rx="6" ry="4"/><ellipse cx="610" cy="505" rx="8" ry="5"/>
    <ellipse cx="710" cy="455" rx="6" ry="4"/>
  </g>
  <!-- ground cracks -->
  <g stroke="#4e3717" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M200,510 l26,8 l-12,10 l30,6"/>
    <path d="M520,545 l-24,8 l14,8 l-26,8"/>
  </g>

  <!-- swaying grass tufts (behind snake) -->
  <g stroke="#5d6b1f" stroke-width="4" fill="none" stroke-linecap="round">
    <g transform="translate(120 430)"><g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 0; 5 0 0; -5 0 0" dur="3.2s" repeatCount="indefinite"/>
      <path d="M0,0 C -4,-22 -10,-34 -18,-46 M0,0 C 0,-24 2,-38 0,-52 M0,0 C 6,-20 12,-32 20,-42"/>
    </g></g>
    <g transform="translate(480 436)"><g>
      <animateTransform attributeName="transform" type="rotate" values="4 0 0; -5 0 0; 4 0 0" dur="2.7s" repeatCount="indefinite"/>
      <path d="M0,0 C -4,-20 -8,-30 -16,-40 M0,0 C 0,-22 2,-34 0,-48 M0,0 C 6,-18 10,-28 18,-38"/>
    </g></g>
    <g transform="translate(730 432)"><g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0; 6 0 0; -4 0 0" dur="3.6s" repeatCount="indefinite"/>
      <path d="M0,0 C -4,-20 -10,-30 -16,-42 M0,0 C 0,-22 2,-36 0,-50 M0,0 C 6,-18 12,-30 18,-40"/>
    </g></g>
  </g>
  <!-- rocks -->
  <g>
    <ellipse cx="205" cy="442" rx="26" ry="16" fill="#8d8577"/>
    <ellipse cx="198" cy="436" rx="18" ry="10" fill="#a8a094"/>
    <ellipse cx="590" cy="452" rx="20" ry="12" fill="#847b6c"/>
    <ellipse cx="585" cy="447" rx="13" ry="7" fill="#9d9484"/>
  </g>

  <!-- ======== SNAKE (crawling) ======== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -46 0; 0 0" dur="9s" repeatCount="indefinite"/>

    <!-- ground shadow -->
    <ellipse cx="360" cy="478" rx="300" ry="20" fill="url(#skShadow)" filter="url(#skSoft)"/>

    <!-- BODY: one animated path, reused for outline / body / blotches / spine -->
    <path id="skBodyPath" d="M -60,452 C 80,410 170,492 310,450 C 450,408 520,492 640,446"
          fill="none" stroke="#2c3a0e" stroke-width="58" stroke-linecap="round">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
        values="M -60,452 C 80,410 170,492 310,450 C 450,408 520,492 640,446;
                M -60,446 C 80,492 170,410 310,452 C 450,494 520,408 640,440;
                M -60,452 C 80,410 170,492 310,450 C 450,408 520,492 640,446"/>
    </path>
    <use href="#skBodyPath" stroke="url(#skBody)" stroke-width="44" fill="none" stroke-linecap="round"/>
    <use href="#skBodyPath" stroke="#33420f" stroke-width="44" fill="none" stroke-linecap="round"
         stroke-dasharray="26 32" opacity="0.55"/>
    <use href="#skBodyPath" stroke="#a4c05e" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.45"/>

    <!-- HEAD -->
    <g transform="translate(640 443)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 3; 0 -3; 0 3" dur="2.4s" repeatCount="indefinite"/>
        <!-- neck blend -->
        <circle cx="-6" cy="1" r="27" fill="#4e7320"/>
        <!-- skull -->
        <ellipse cx="24" cy="-2" rx="32" ry="23" fill="#557a1f" stroke="#2c3a0e" stroke-width="3"/>
        <!-- snout -->
        <ellipse cx="46" cy="2" rx="14" ry="12" fill="#64892c"/>
        <circle cx="52" cy="-1" r="2.4" fill="#22300a"/>
        <!-- jaw line -->
        <path d="M-2,12 Q26,18 50,10" fill="none" stroke="#2c3a0e" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
        <!-- brow ridge -->
        <path d="M6,-16 Q20,-22 34,-18" fill="none" stroke="#2c3a0e" stroke-width="3" stroke-linecap="round"/>

        <!-- EYE (blinks) -->
        <g transform="translate(20 -8)">
          <g>
            <animateTransform attributeName="transform" type="scale" values="1 1; 1 1; 1 0.08; 1 1; 1 1" keyTimes="0; 0.88; 0.93; 0.98; 1" dur="5s" repeatCount="indefinite"/>
            <ellipse cx="0" cy="0" rx="9" ry="9.5" fill="#f5c542" stroke="#2c3a0e" stroke-width="2"/>
            <rect x="-1.8" y="-8" width="3.6" height="16" rx="1.8" fill="#141a05"/>
            <circle cx="-3" cy="-3.5" r="2" fill="#ffffff" opacity="0.9"/>
          </g>
        </g>

        <!-- FORKED TONGUE (flicks) -->
        <g transform="translate(58 4)">
          <g>
            <animateTransform attributeName="transform" type="scale" values="0.15; 1; 1; 0.15; 0.15" keyTimes="0; 0.1; 0.5; 0.62; 1" dur="3.4s" repeatCount="indefinite"/>
            <path d="M0,0 L24,-3 M24,-3 L38,-12 M24,-3 L38,6" fill="none" stroke="#d63a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M0,0 L24,-3 M24,-3 L38,-12 M24,-3 L38,6" fill="none" stroke="#f0665a" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- dust puffs kicked up -->
  <g fill="#e8cf9e">
    <ellipse cx="250" cy="472" rx="4" ry="3" opacity="0">
      <animate attributeName="rx" values="4;20;26" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;9;11" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="430" cy="480" rx="4" ry="3" opacity="0">
      <animate attributeName="rx" values="4;18;24" begin="0.8s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;8;10" begin="0.8s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0" begin="0.8s" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="580" cy="472" rx="4" ry="3" opacity="0">
      <animate attributeName="rx" values="4;16;22" begin="1.6s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="3;7;9" begin="1.6s" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" begin="1.6s" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- foreground grass for depth -->
  <g stroke="#4a5a16" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9">
    <g transform="translate(60 600)"><g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 0; 5 0 0; -4 0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M0,0 C -6,-40 -14,-70 -26,-100 M0,0 C 0,-44 4,-76 0,-110 M0,0 C 8,-38 18,-66 30,-92"/>
    </g></g>
    <g transform="translate(750 600)"><g>
      <animateTransform attributeName="transform" type="rotate" values="5 0 0; -4 0 0; 5 0 0" dur="3.4s" repeatCount="indefinite"/>
      <path d="M0,0 C -6,-40 -14,-70 -26,-100 M0,0 C 0,-44 4,-76 0,-110 M0,0 C 8,-38 18,-66 30,-92"/>
    </g></g>
  </g>

  <!-- warm vignette -->
  <rect x="0" y="0" width="800" height="600" fill="#7a4a12" opacity="0.08"/>
</svg>

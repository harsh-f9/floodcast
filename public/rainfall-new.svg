<svg width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="55%" stop-color="#3d7ab5"/>
      <stop offset="100%" stop-color="#bfe3ff"/>
    </linearGradient>
    <linearGradient id="rnField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5da24a"/>
      <stop offset="100%" stop-color="#2f7031"/>
    </linearGradient>
    <linearGradient id="rnGaugeWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cc7f5"/>
      <stop offset="100%" stop-color="#1f7fc1"/>
    </linearGradient>
    <filter id="rnSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#rnSky)"/>

  <!-- distant hills -->
  <ellipse cx="180" cy="430" rx="260" ry="70" fill="#8fc07e" opacity="0.55"/>
  <ellipse cx="640" cy="435" rx="280" ry="75" fill="#79b168" opacity="0.55"/>

  <!-- main cloud (drifts gently) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 26 0; 0 0" dur="9s" repeatCount="indefinite"/>
    <ellipse cx="400" cy="150" rx="190" ry="70" fill="#f4f8fc"/>
    <ellipse cx="300" cy="165" rx="110" ry="55" fill="#e6eff7"/>
    <ellipse cx="505" cy="165" rx="120" ry="58" fill="#e6eff7"/>
    <ellipse cx="400" cy="118" rx="140" ry="48" fill="#ffffff"/>
    <ellipse cx="400" cy="205" rx="170" ry="30" fill="#c9dcea" opacity="0.8"/>
  </g>

  <!-- small cloud -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; -20 0; 0 0" dur="11s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="90" rx="90" ry="34" fill="#eef4fa"/>
    <ellipse cx="150" cy="76" rx="62" ry="24" fill="#ffffff"/>
  </g>

  <!-- rain: three falling layers -->
  <g stroke="#cfe9ff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -120; 0 220" dur="1.1s" repeatCount="indefinite"/>
      <line x1="250" y1="220" x2="238" y2="268"/>
      <line x1="330" y1="220" x2="318" y2="268"/>
      <line x1="410" y1="220" x2="398" y2="268"/>
      <line x1="490" y1="220" x2="478" y2="268"/>
      <line x1="570" y1="220" x2="558" y2="268"/>
    </g>
  </g>
  <g stroke="#8fc5ef" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -80; 0 260" dur="1.5s" repeatCount="indefinite"/>
      <line x1="290" y1="220" x2="280" y2="262"/>
      <line x1="370" y1="220" x2="360" y2="262"/>
      <line x1="450" y1="220" x2="440" y2="262"/>
      <line x1="530" y1="220" x2="520" y2="262"/>
    </g>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -40; 0 300" dur="1.9s" repeatCount="indefinite"/>
      <line x1="310" y1="220" x2="302" y2="254"/>
      <line x1="430" y1="220" x2="422" y2="254"/>
      <line x1="550" y1="220" x2="542" y2="254"/>
    </g>
  </g>

  <!-- field -->
  <path d="M0,420 Q200,395 400,415 Q600,435 800,410 L800,600 L0,600 Z" fill="url(#rnField)"/>
  <g stroke="#245c26" stroke-width="2" opacity="0.35">
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="505" x2="800" y2="505"/>
    <line x1="0" y1="545" x2="800" y2="545"/>
  </g>
  <!-- crop sprouts -->
  <g stroke="#d9f2c7" stroke-width="4" stroke-linecap="round">
    <path d="M120,470 v-22 M112,456 l8,6 8,-6" fill="none"/>
    <path d="M240,505 v-22 M232,491 l8,6 8,-6" fill="none"/>
    <path d="M360,470 v-22 M352,456 l8,6 8,-6" fill="none"/>
    <path d="M480,505 v-22 M472,491 l8,6 8,-6" fill="none"/>
    <path d="M600,470 v-22 M592,456 l8,6 8,-6" fill="none"/>
    <path d="M700,505 v-22 M692,491 l8,6 8,-6" fill="none"/>
  </g>

  <!-- rain gauge -->
  <g transform="translate(620 350)">
    <rect x="-34" y="30" width="68" height="110" rx="8" fill="#ffffff" opacity="0.92"/>
    <rect x="-34" y="30" width="68" height="110" rx="8" fill="none" stroke="#0a3d62" stroke-width="5"/>
    <!-- water filling (rises and loops) -->
    <rect x="-26" y="60" width="52" height="72" rx="5" fill="url(#rnGaugeWater)">
      <animate attributeName="y" values="110;55;110" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="22;77;22" dur="5s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#0a3d62" stroke-width="2" opacity="0.7">
      <line x1="14" y1="50" x2="26" y2="50"/>
      <line x1="14" y1="70" x2="26" y2="70"/>
      <line x1="14" y1="90" x2="26" y2="90"/>
      <line x1="14" y1="110" x2="26" y2="110"/>
    </g>
    <ellipse cx="0" cy="30" rx="34" ry="10" fill="#dbe9f5" stroke="#0a3d62" stroke-width="5"/>
    <!-- funnel -->
    <path d="M-46,0 L46,0 L20,30 L-20,30 Z" fill="#0a3d62"/>
    <path d="M-46,0 L46,0 L40,6 L-40,6 Z" fill="#3d7ab5"/>
  </g>

  <!-- splash rings on field -->
  <g fill="none" stroke="#e8f6ff" stroke-width="2" opacity="0.7">
    <ellipse cx="180" cy="450" rx="4" ry="2">
      <animate attributeName="rx" values="3;16;3" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="330" cy="470" rx="4" ry="2">
      <animate attributeName="rx" values="3;15;3" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="480" cy="450" rx="4" ry="2">
      <animate attributeName="rx" values="3;17;3" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- soft vignette -->
  <rect x="0" y="0" width="800" height="600" fill="#0a3d62" opacity="0.06"/>
</svg>
